              '<span class="dim">Tip: try <span class="cmd-link" data-c="sudo hire-me">sudo hire-me</span></span>',
            ];
          },

          clear: function () {
            outEl.innerHTML = "";
            return [];
          },

          cls: function () {
            return COMMANDS.clear();
          },

          exit: function () {
            return ["logout", "[Process completed - session restarted]"];
          },

          touch: function (args) {
            return [
              '<span class="c-err">touch: cannot touch \'' +
                escapeHtml(args || "file") +
                "': Read-only file system</span>",
            ];
          },

          mkdir: function (args) {
            return [
              '<span class="c-err">mkdir: cannot create directory \'' +
                escapeHtml(args || "dir") +
                "': Read-only file system</span>",
            ];
          },

          rm: function (args) {
            return [
              '<span class="c-err">rm: cannot remove \'' +
                escapeHtml(args || "file") +
                "': Read-only file system</span>",
            ];
          },
        };

        COMMANDS.fastfetch = COMMANDS.neofetch;
        COMMANDS.man = COMMANDS.help;
        COMMANDS.dir = COMMANDS.ls;
        COMMANDS.xdg_open = COMMANDS.open;

        function executeCommand(rawInput) {
          var raw = rawInput.trim();
          if (!raw) return;

          history.push(raw);
          histIndex = history.length;

          printPromptEcho(raw);

          var parts = raw.split(/\s+/);
          var cmd = parts[0].toLowerCase();
          var args = parts.slice(1).join(" ");

          if (COMMANDS[cmd]) {
            var res = COMMANDS[cmd](args);
            if (res && res.length) {
              printLines(res);
            }
          } else {
            printLines([
              '<span class="c-err">bash: ' +
                escapeHtml(cmd) +
                ": command not found</span>",
              '<span class="dim">Type <span class="cmd-link" data-c="help">help</span> or <span class="cmd-link" data-c="ls">ls</span> to see available commands.</span>',
            ]);
          }

          bodyEl.scrollTop = bodyEl.scrollHeight;
        }

        // Handle Input Keydown
        inputEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            var val = inputEl.value;
            inputEl.value = "";
            executeCommand(val);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            if (histIndex > 0) {
              histIndex--;
              inputEl.value = history[histIndex] || "";
            }
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            if (histIndex < history.length - 1) {
              histIndex++;
              inputEl.value = history[histIndex] || "";
            } else {
              histIndex = history.length;
              inputEl.value = "";
            }
          } else if (e.key === "Tab") {
            e.preventDefault();
            handleTabCompletion();
          } else if (e.ctrlKey && e.key === "l") {
            e.preventDefault();
            COMMANDS.clear();
          } else if (e.ctrlKey && e.key === "c") {
            e.preventDefault();
            printPromptEcho(inputEl.value + "^C");
            inputEl.value = "";
            bodyEl.scrollTop = bodyEl.scrollHeight;
          }
        });

        function handleTabCompletion() {
          var val = inputEl.value.trimStart();
          var allCmds = Object.keys(COMMANDS);
          var activeFiles = Object.keys(
            (currentDir === "~" ? VFS["~"] : VFS["~"].items["projects"]).items,
          );

          if (val.indexOf(" ") === -1) {
            // Complete command
            var matches = allCmds.filter(function (c) {
              return c.startsWith(val);
            });
            if (matches.length === 1) {
              inputEl.value = matches[0] + " ";
            } else if (matches.length > 1) {
              printPromptEcho(val);
              printLines([matches.join("   ")]);
            }
          } else {
            var parts = val.split(/\s+/);
            var last = parts[parts.length - 1];
            var fileMatches = activeFiles.filter(function (f) {
              return f.startsWith(last);
            });
            if (fileMatches.length === 1) {
              parts[parts.length - 1] = fileMatches[0];
              inputEl.value = parts.join(" ");
            } else if (fileMatches.length > 1) {
              printPromptEcho(val);
              printLines([fileMatches.join("   ")]);
            }
          }
        }

        // Click delegates
        document.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-c]");
          if (btn) {
            var cmd = btn.getAttribute("data-c");
            if (cmd) {
              executeCommand(cmd);
              inputEl.focus();
              return;
            }
          }
          // Clicking anywhere in the terminal focuses input unless text is selected
          if (!window.getSelection().toString()) {
            inputEl.focus();
          }
        });

        // Welcome Boot Banner (Immediate, zero animation delay)
        function initTerminal() {
          printLines([
            "",
            "  ███████╗██╗  ██╗██╗██╗   ██╗ █████╗ ███╗   ███╗    ██████╗  █████╗ ██╗   ██╗",
            "  ██╔════╝██║  ██║██║██║   ██║██╔══██╗████╗ ████║    ██╔══██╗██╔══██╗╚██╗ ██╔╝",
            "  ███████╗███████║██║██║   ██║███████║██╔████╔██║    ██████╔╝███████║ ╚████╔╝ ",
            "  ╚════██║██╔══██║██║╚██╗ ██╔╝██╔══██║██║╚██╔╝██║    ██╔══██╗██╔══██║  ╚██╔╝  ",
            "  ███████║██║  ██║██║ ╚████╔╝ ██║  ██║██║ ╚═╝ ██║    ██║  ██║██║  ██║   ██║   ",
            "  ╚══════╝╚═╝  ╚═╝╚═╝  ╚═══╝  ╚═╝  ╚═╝╚═╝     ╚═╝    ╚═╝  ╚═╝╚═╝  ╚═╝   ╚═╝   ",
            "",
            '  <span class="bold c-user">Linux 6.8.0-generic x86_64</span>',
            '  Welcome to <span class="bold c-accent">Shivam Ray</span>\'s Portfolio Terminal (bash 5.2.21)',
            "",
            '  * Documentation: Type <span class="cmd-link" data-c="help">help</span> for commands',
            '  * Quick bio:     Type <span class="cmd-link" data-c="about">about</span> or <span class="cmd-link" data-c="neofetch">neofetch</span>',
            '  * Projects:      Type <span class="cmd-link" data-c="projects">projects</span> to explore',
            '  * Files:         Type <span class="cmd-link" data-c="ls -la">ls -la</span> to browse files',
            "",
            '  <span class="dim">Tip: Use Tab for autocomplete, ↑/↓ for command history.</span>',
            "",
          ]);
          inputEl.focus();
        }

        initTerminal();
      })();
    </script>
